[package]
name = "fireplace"
version = "0.7.0"
edition = "2024"

description = "A client for Firebase that seeks to provide a user-friendly interface to interact with Firestore, Firebase Auth, and similar."
license = "MIT"
keywords = ["firebase", "firestore", "firebase-auth"]
categories = ["database", "authentication", "web-programming"]
repository = "https://github.com/avborup/fireplace"
homepage = "https://github.com/avborup/fireplace"
readme = "README.md"

[dependencies]
anyhow = "1.0"
firestore_grpc = "0.284"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
prost-types = "0.9"
thiserror = "2.0"
jsonwebtoken = { version = "11.0" , features = ["rust_crypto", "use_pem"] }
futures = "0.3.31"
reqwest = { version = "0.13.4", features = ["json", "form"] }
tracing = "0.1"
openssl = "0.10"
once_cell = "1.18"
erased-serde = "0.4"
typed-builder-macro = "0.23"
typed-builder = "0.23"
serde_with = "3.22"
url = "2.5"
chrono = "0.4"

[dev-dependencies]
ulid = "3.0"
env_logger = "0.11"
